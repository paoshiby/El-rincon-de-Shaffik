<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/style.css">
    <title>El Rincón de Shafik</title>
</head>
<body>
    <nav>
        <div class="img-container">
            <img src="/img/2.png" alt="mono" width="90">
        </div>
        <div class="button-container">
            <button><a href="index.html">Inicio</a></button>
            <button><a href="us.html">Nosotros</a></button>
            <button><a href="contact.html">Contacto</a></button>
            <button><a href="login.html">Inicio Sesión</a></button>
        </div>
    </nav>
    <header>
        <div class="Baner"></div>
    </header>
    <main>
        <legend>Formulario de Contacto</legend>
        <div>
            <table class="formu">
                <form>
                    <tr>
                        <td class="t1">
                            <label for="contname">Nombres:</label>
                        </td>
                        <td >
                            <input class="inputs" type="text" id="contname" name="contname" placeholder="Nombres">
                            <input class="inputs" type="text" id="contname" name="contlastname" placeholder="Apellidos">
                        </td>
                    </tr>
                    <tr>
                        <td class="t1">
                            <label for="mail">Email:</label>
                        </td>
                        <td >
                            <input class="inputs" type="email" id="mail" name="mail" placeholder="example@gmail.com">
                        </td>
                    </tr>
                    <tr>
                        <td class="t1">
                            <label for="contphone">Teléfono:</label>
                        </td>
                        <td>
                            <input class="codearea inputs" type="text" value="+569" readonly>
                            <input class="inputs" type="tel" id="contphone" name="contphone"placeholder="12345678">
                        </td>
                    </tr>
                    <tr>
                        <td class="t1">
                            <label for="subject">Asunto:</label>
                        </td>
                        <td>
                            <select class="inputs" name="subject" id="sub">
                                <option class="inputs" value="1">Otro</option>
                                <option class="inputs" value="2">Información sobre academias en Chile</option>
                                <option class="inputs" value="3">Información de diseñadores de vestuarios</option>
                                <option class="inputs" value="4">Mayor información sobre la Golden Era</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td class="t1" id="mess">
                            <label for="message">Mensaje:</label>
                        </td>
                        <td>
                            <textarea name="message" id="message" rows="15" cols="51"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td id="boton" colspan="2">
                            <input class="boton" type="submit" value="Enviar">
                        </td>
                    </tr>
                </form>
            </table>
        </div>
    </main>
    <footer>
        <div class="foot">
            <div class="ft">
                <div id="t">
                    <h3>Nuestro Contenido</h3>
                </div>
                <div id="t-2">
                    <h3>Información</h3>
                </div>
                <div id="t-3">
                    <h3>Redes Sociales</h3>
                </div>
                <div id="t1">
                    <ul class="footlist">
                        <li>
                            <a href="#" class="a1">Origen del Bellydance</a>
                        </li>
                        <li>
                            <a href="#" class="a1">Golden Era</a>
                        </li>

                </div>
                <div id="t4">
                    <ul class="footlist">
                        <li>
                            <a href="#" class="a1">¿Quién es <span id="we">'El Rincón de Shaffik'</span>?</a>
                        </li>
                        <li>
                            <a href="contact.html" class="a1">Contacto</a>
                        </li>
                        <li>
                            <a href="#" class="a1">Preguntas Frecuentess</a>
                        </li>
                    </ul>
                </div>
                <div id="t2">
                    <div id="face">
                        <a href="#"><img src="/img/facebook.png" alt="facebook" width="50"></a>
                    </div>
                    <div id="insta">
                        <a href="#"><img src="/img/instagram.png" alt="instagram" width="65"></a>
                    </div>
                    <div id="wha">
                        <a href="#"><img src="/img/whatsapp.png" alt="Whatsapp" width="50"></a>
                    </div>
                </div>
            </div>
        </div>
        <div id="t3">
