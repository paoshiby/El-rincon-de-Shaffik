<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/style.css">
    <title>El Rincón de Shafik</title>
    <link rel="shortcut icon" href="/img/logo1.png" type="image/x-pnj">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
    <div class="bckgd">
        <header class="header">
            <div class="container-fluid button-container d-flex flex-wrap justify-content-center align-items-center">
                <a class="d-flex mb-sm-0 mb-md-0 mb-lg-0 me-lg-auto me-md-auto me-sm-auto ms-5" href="/HTML/index.html" >
                    <img src="/img/1.png" alt="Logo" height="100">
                </a>
            </div>
        </header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid d-flex flex-wrap justify-content-center">
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#miMenu">
                    <span class="navbar-toggler-icon text-info"></span>
                </button>
                <div class="collapse navbar-collapse " id="miMenu">
                    <ul class="nav me-auto justify-content-center mx-auto">
                        <li class="nav-item"  id="bin">
                            <a href="/HTML/index.html" class="nav-link" id="leter" aria-current="page">Inicio</a>
                        </li>
                        <li class="nav-item" id="bco">
                            <a href="/HTML/contact.html" class="nav-link nav-active" id="leter">Contacto</a>
                        </li>
                        <li class="nav-item" id="bus">
                            <a href="/HTML/us.html" class="nav-link" id="leter">Sobre Nosotros</a>
                        </li>
                        <li class="nav-item" id="blo">
                            <a href="/HTML/login.html" class="nav-link" id="leter">Iniciar Sesión/Registrarse</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
    <div class="carousel carousel-fade ms-0" id="mCarrusel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="/caption.jpg" alt="Baalbek">
            </div>
            <div class="carousel-item">
                <img src="/images.jfif" alt="Mezquita del Profeta">
            </div>
            <div class="carousel-item">
                <img src="/petra-4.jpg" alt="Petra">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#mCarrusel" data-bs-slide="prev"> 
            <span class="carousel-control-prev-icon" aria-hidden="true"></span> 
            <span class="visually-hidden">Previous</span> 
        </button> 
        <button class="carousel-control-next" type="button" data-bs-target="#mCarrusel" data-bs-slide="next"> 
            <span class="carousel-control-next-icon" aria-hidden="true"></span> 
            <span class="visually-hidden">Next</span> 
        </button>
    </div>
    <main class="back container-md my-5 p-3">
        <legend class="text-center mb-4">Formulario de Contacto</legend>
        <form id="formulario">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="contname" class="form-label">Nombres:</label>
                    <input type="text" class="form-control" id="contname" name="contname" placeholder="Nombres">
                </div>
                <div class="col-md-6">
                    <label for="contlastname" class="form-label">Apellidos:</label>
                    <input type="text" class="form-control" id="contlastname" name="contlastname" placeholder="Apellidos">
                </div>
                <div class="col-md-6">
                    <label for="contphone" class="form-label">Teléfono:</label>
                    <div class="input-group mt-4">
                        <span class="input-group-text">+569</span>
                        <input type="tel" class="form-control" id="contphone" name="contphone" placeholder="12345678">
                    </div>
                </div>
                <div class="col-md-6 d-flex">
                    <label for="gender" class="form-label me-4">Sexo:</label>
                    <div class="d-flex flex-column gap-3">
                        <div class="form-check pt-4">
                            <input class="form-check-input" type="radio" name="gender" id="Fgender">
                            <label class="form-check-label" for="Fgender">Femenino</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="Mgender">
                            <label class="form-check-label" for="Mgender">Masculino</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="Ogender">
                            <label class="form-check-label" for="Ogender">Otro</label>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <label for="subject" class="form-label">Asunto:</label>
                    <select class="form-select" name="subject" id="sub">
                        <option value="1">Otro</option>
                        <option value="2">Información sobre academias en Chile</option>
                        <option value="3">Información de diseñadores de vestuarios</option>
                        <option value="4">Mayor información sobre la Golden Era</option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="message" class="form-label ">Mensaje:</label>
                    <textarea class="form-control" name="message" id="message" rows="5"></textarea>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn boton">Enviar</button>
                </div>
            </div>
        </form>
    </main>
    <div class="fot" data-aos="flip-down" data-aos-delay="300" data-aos-duration="1000" data-aos-easing="ease-out-cubic">
        <footer class="text-center text-white">
            <div class="container p-4 pb-0">
                <section class="mb-2">
                    <a class="btn btn-floating m-1" id="face" href="#!" role="button">
                        <i class="fab fa-facebook-f"></i
                    ></a>
                    <a class="btn btn-floating m-1" id="inst" href="#!" role="button">
                        <i class="fab fa-instagram"></i
                    ></a>
                    <a class="btn btn-floating m-1" id="wha"href="#!" role="button">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                </section>
            </div>
            <div class="text-center p-2 cred">
                © 2025 Paola Medina Fernández
            </div>
        </footer>
    </div>
    <!--Inicio de Sesión-->
    <div class="offcanvas offcanvas-end obck" tabindex="-1" id="offcanvasLogin" aria-labelledby="offcanvasExampleLabel">
        <div class="offcanvas-body">
            <div class="form-offcanvas-content form-content-base mt-2 p-0">
                <div class="login-html">
                    <input id="tab-1" type="radio" name="tab" class="sign-in" checked><label for="tab-1" class="tab">Iniciar Sesión</label>
                    <input id="tab-2" type="radio" name="tab" class="sign-up">
                    <label for="tab-2" class="tab">
                        <a href="/HTML/login.html" class="tab-link">Registrarse</a> 
                    </label>
                    <div class="login-form">
                        <div class="sign-in-htm">
                            <div class="group">
                                <label for="user-in" class="label">Usuario:</label>
                                <input id="user-in" type="text" class="input">
                            </div>
                            <div class="group">
                                <label for="pass-in" class="label">Contraseña:</label>
                                <input id="pass-in" type="password" class="input" data-type="password">
                            </div>
                            <div class="group">
                                <input id="check" type="checkbox" class="check" checked>
                                <label for="check">
                                    <span class="icon"></span> Mantener iniciado
                                </label>
                            </div>
                            <div class="group">
                                <input type="submit" class="button" value="Iniciar Sesión">
                            </div>
                            <div class="hr"></div>
                            <div class="foot-lnk">
                                <a class="a" href="#forgot">Olvidó contraseña?</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="/JS/contact.js"></script>
    <script src="/JS/login.js"></script>
</body>
</html>
