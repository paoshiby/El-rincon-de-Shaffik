<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Rincón de Shafik</title>
</head>
<body style="padding: 2%; position: relative; background-image: url(/img/fondo3.png); background-repeat: no-repeat; background-size: cover; background-position: center; background-attachment: fixed; overflow-x: hidden;">
    <nav style="margin-bottom: 2.5%; background-color: #55d5c9; border: 2px dotted #1c3394; display: flex; justify-content: space-between; align-items: center;">
        <div style="flex: 2; margin: 1%; ">
            <img src="/img/2.png" alt="mono" width="90">
        </div>
        <div style="flex: 1; display: flex; gap: 5px; justify-content: end; margin-right: 1%;">
            <button style="width: 25%;height: 30px; background-color: #f5bf57; color: #1c3394; border: #f5bf57;"><a href="index.html" style="text-decoration: none; font-weight: bolder;">Inicio</a></button>
            <button style="width: 25%;height: 30px; background-color: #f5bf57; color: #1c3394; border: #f5bf57;"><a href="contact.html" style="text-decoration: none; font-weight: bolder;">Contacto</a></button>
        </div>
    </nav>
    <header style="margin-bottom: 2%;">
        <img src="/img/Pyramid of Giza .jpg" alt="banner" style="width: 99.9%;">
    </header>
    <main style="margin-bottom: 20%; margin-top: 5%;">
        <legend style="text-align: center; font-size: xx-large; padding-bottom: 2%;">Formulario de Contacto</legend>
        <div>
            <table style="border-spacing: 30px 20px; padding-left: 28%; ">
                <form>
                    <tr>
                        <td style="font-size: large; color: #2f00ff;">
                            <label for="contname">Nombres:</label>
                        </td>
                        <td >
                            <input type="text" id="contname" name="contname" placeholder="Nombres" style="width: 45%; height: 20px; background-color:#ecc06eb3; border: 1px #ecc06eb3; color: #2f00ff;">
                            <input type="text" id="contname" name="contlastname" placeholder="Apellidos" style="width: 49%; height: 20px; background-color:#ecc06eb3; border: 1px #ecc06eb3; color: #2f00ff;">
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size: large; color: #2f00ff;">
                            <label for="">Email:</label>
                        </td>
                        <td >
                            <input type="email" placeholder="example@gmail.com" style="width: 97%; height: 20px; background-color:#ecc06eb3; border: 1px #ecc06eb3; color: #2f00ff;">
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size: large; color: #2f00ff;">
                            <label for="contphone">Teléfono:</label>
                        </td>
                        <td >
                            <input type="text" value="+569" name="contphone" readonly  style="width: 44px; height: 20px; background-color:#ecc06eb3; border: 1px #ecc06eb3; color: #2f00ff;" >
                            <input type="number" id="contphone" name="contphone"placeholder="12345678" style="width: 83%; height: 20px; background-color:#ecc06eb3; border: 1px #ecc06eb3; color: #2f00ff;">
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size: large; color: #2f00ff;">
                            <label for="subject">Asunto:</label>
                        </td>
                        <td>
                            <select name="subject" id="sub" style="width: 100%; height: 25px; background-color:#ecc06eb3; border: 1px #ecc06eb3; color: #2f00ff; font-size: medium;">
                                <option value="1" style="color: #2f00ff;font-size: medium; background-color:#ecc06eb3; border: 1px #ecc06eb3;">Otro</option>
                                <option value="2" style="color: #2f00ff; font-size: medium; background-color:#ecc06eb3; border: 1px #ecc06eb3;">Información sobre academias en Chile</option>
                                <option value="3" style="color: #2f00ff; font-size: medium; background-color:#ecc06eb3; border: 1px #ecc06eb3;">Información de diseñadores de vestuarios</option>
                                <option value="4" style="color: #2f00ff; font-size: medium; background-color:#ecc06eb3; border: 1px #ecc06eb3;">Mayor información sobre la Golden Era</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size: large; padding-bottom: 40%;">
                            <label for="message" style="color: #2f00ff;">Mensaje:</label>
                        </td>
                        <td>
                            <textarea name="message" id="message" rows="15" cols="50" style="background-color:#ecc06eb3; border: 1px #ecc06eb3;"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: right;">
                            <input type="submit" value="Enviar" style="width: 20%; height: 30px; background-color: #f5bf57; color: #1c3394; border: 2px #ecbf6e; font-weight: bolder;">
                        </td>
                    </tr>
                </form>
            </table>
        </div>
    </main>
    <footer style="bottom: 2%; position: absolute; width: 100%; background-color: #55d5c9;">
        <table style="border: 2px dotted  #1c3394; border-spacing: 10px 5px;">
            <tr>
                <th>Nuestro Contenido</th>
                <th>Información</th>
                <th>Redes Sociales</th>
            </tr>
            <tr>
                <td style="padding-left: 7%;">
                    <div>
                        <ul >
                            <li style="list-style: none;">
                                <a href="#" style="text-decoration: none; color: black; font-size: large;">Origen del Bellydance</a>
                            </li>
                            <li style="list-style: none;">
                                <a href="#" style="text-decoration: none; color: black; font-size: large;">Golden Era</a>
                            </li>
                            <li style="list-style: none;">
                                <a href="#" style="text-decoration: none; color: black; font-size: large;">Estilos de Bellydance</a>
                            </li>
                        </ul>
                    </div>
                </td>
                <td style=" padding-left: 5.9%;">
                    <ul >
                        <li style="list-style: none;">
                            <a href="#" style="text-decoration: none; color: black; font-size: large;">¿Quién es <span style="color: #1c3394;">'El Rincón de Shaffik'</span>?</a>
                        </li>
                        <li style="list-style: none;">
                            <a href="contact.html" style="text-decoration: none; color: black; font-size: large;">Contacto</a>
                        </li>
                        <li style="list-style: none;">
                            <a href="#" style="text-decoration: none; color: black; font-size: large;">Preguntas Frecuentess</a>
                        </li>
                    </ul>
                </td>
                <td style="width: 33.3%;">
                    <div>
                        <table style="border-spacing: 180px 0px;">
                            <tr>
                                <td style="width: 100%;">
                                    <a href="#"><img src="/img/instagram.png" alt="instagram" width="50"></a>
                                </td>
                            </tr>
                            <tr>
                                <td style="width: 100%; padding-left: 13%;">
                                    <img src="/img/whatsapp.png" alt="Whatsapp" width="37">
                                </td>
                            </tr>
                        </table>
                    </div>
                </td>
            </tr>
        </table>
        <table style="margin-top: 1%; width: 96.5%;">
            <tr>
                <td style="text-align: center;border: 2px dotted  #1c3394;">
                    <div>
                        <p>&copy; Paola Medina Fernández 2025</p>
                    </div>
                </td> 
            </tr>
        </table>
    </footer>
</body>
</html>
